[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-sticker-album"
version = "2.0.1"
description = "Model-agnostic WeChat sticker album production workflow for Codex"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
